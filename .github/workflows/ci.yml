name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, test, build
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting
        run: |
          npm run format:check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check capability boundary
        run: npm run check:capabilities

      - name: Lint and typecheck frontend
        run: |
          npm run lint
          npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Lint and test Rust
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build frontend
        run: npm run build:web

      - name: Build Tauri app without bundling
        run: npm run tauri build -- --no-bundle --target aarch64-apple-darwin
