name: CI (manual fallback)

# Normal verification runs on the maintainer's Mac with `npm run ci:local`.
# Keep this only as an explicit emergency fallback so pushes and PRs never
# consume GitHub-hosted Actions minutes automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, test, build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting
        run: |
          npm run format:check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check capability boundary
        run: npm run check:capabilities

      - name: Check locale contract
        run: npm run check:locales

      - name: Lint and typecheck frontend
        run: |
          npm run lint
          npm run typecheck

      - name: Test frontend
        run: |
          npm test
          npm run test:release

      - name: Lint and test Rust
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build frontend
        run: npm run build:web

      - name: Build Tauri app without bundling
        run: npm run tauri build -- --no-bundle --target aarch64-apple-darwin
