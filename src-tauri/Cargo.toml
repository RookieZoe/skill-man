[package]
name = "skill-man"
version = "0.1.4"
description = "A macOS Library for managing AI Agent Skills"
authors = ["RookieZoe"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "skill_man_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "skill-man"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
futures-util = "0.3.33"
libc = "0.2.189"
parking_lot = "0.12"
plist = "1.8.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "blocking"] }
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2.4.1"
tempfile = "3.27.0"
thiserror = "2.0.17"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAlert", "NSImage", "NSFont", "NSColor", "NSParagraphStyle", "NSAttributedString", "NSText", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSControl", "NSTextField", "NSProgressIndicator"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSNotification", "NSObject", "NSString"] }

[[test]]
name = "native_branding"
harness = false

[[test]]
name = "native_menu"
harness = false
